name: tfg-linux-ha-demo

# Reproducible demonstration, independent from the original three VMware VMs.
# No cloud account is required and the HTTP port is accessible only on localhost.
services:
  node1:
    image: nginx:stable-alpine
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./node1/index.html:/usr/share/nginx/html/index.html:ro
    networks:
      - internal
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 3s
      timeout: 2s
      retries: 10
      start_period: 5s

  node2:
    image: nginx:stable-alpine
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./node2/index.html:/usr/share/nginx/html/index.html:ro
    networks:
      - internal
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 3s
      timeout: 2s
      retries: 10
      start_period: 5s

  lb:
    image: haproxy:3.2-alpine
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      node1:
        condition: service_healthy
      node2:
        condition: service_healthy
    networks:
      - internal
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "haproxy", "-c", "-f", "/usr/local/etc/haproxy/haproxy.cfg"]
      interval: 10s
      timeout: 3s
      retries: 3

networks:
  internal:
    driver: bridge
