global
    log stdout format raw local0

defaults
    log global
    mode http
    option httplog
    timeout connect 3s
    timeout client 30s
    timeout server 30s

frontend http_in
    bind *:8080
    default_backend web_nodes

backend web_nodes
    balance roundrobin
    option httpchk
    http-check send meth GET uri /health ver HTTP/1.1 hdr Host localhost
    http-check expect status 200
    http-response set-header X-Backend-Node %[srv_name]
    server node1 node1:80 check inter 1s fall 2 rise 2
    server node2 node2:80 check inter 1s fall 2 rise 2
